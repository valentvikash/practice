<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
    
    <h2 id="OTP">---</h2>
    <i class="fa-brands fa-facebook"></i>
    <button onclick="Showotp()">click</button>
    <button type="button" class="btn">Base class</button>
    <button type="button" class="theme-primary btn-solid btn-styled">
  Click me
</button>

<button type="button" class="theme-warning btn-solid btn-styled">
  <svg class="bi me-1" width="16" height="16" aria-hidden="true">
    <use href="#arrow-left" />
  </svg>
  With left icon
</button>

<button type="button" class="theme-danger btn-solid btn-styled">With right icon
  <svg class="bi ms-1" width="16" height="16" aria-hidden="true">
    <use href="#arrow-right" />
  </svg>
</button>

<button type="button" class="btn-icon theme-primary btn-solid btn-styled" aria-label="Icon only">
  <svg class="bi" width="16" height="16" aria-hidden="true">
    <use href="#plus-lg" />
  </svg>
</button>

</body>

<script>

    function Showotp(){
        let O =Math.floor(Math.random()*900000);
        document.getElementById("OTP").textContent= O;
    }

</script>
</html>
