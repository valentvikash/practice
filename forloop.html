<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input id="table" placeholder="enter a number" type="number">
    <button id="btn" onclick="tableprint()">print table</button>
    <div id="result">
    </div>
    

</body>
<script>


    function tableprint() {
        let n1 = Number(document.getElementById("table").value)
        
        let output = "";
        for (let i = 1; i <= 10; i++) {
            output += n1 + " x " + i + " = " + (n1 * i) + "<br>";
        }
        document.getElementById("result").innerHTML = output;
    }

</script>

</html>
